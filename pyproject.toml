[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "tg-ws-proxy-docker"
dynamic=["version"]

description = "Telegram WebSocket Proxy with MTProto and SOCKS5 support"
requires-python = ">=3.13"

license = { name = "MIT", file = "LICENSE" }

authors = [
    { name = "Flowseal"},
    { name = "LordArrin"},
]

keywords = [
    "telegram",
    "tdesktop",
    "proxy",
    "bypass",
    "websocket",
    "mtproto",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Customer Service",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking :: Firewalls",
]

dependencies = [
    "cryptography>=50.0.0",
    "uvloop>=0.22.1",
    "certifi>=2026.7.22",
]

[project.scripts]
tg-ws-proxy = "proxy.tg_ws_proxy:main"

[project.urls]
Source = "https://github.com/LordArrin/tg-ws-proxy-docker"
Issues = "https://github.com/LordArrin/tg-ws-proxy-docker/issues"

[tool.hatch.build.targets.wheel]
packages = ["proxy", "utils"]

[tool.hatch.version]
path = "proxy/__init__.py"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4"]
ignore = ["F403", "F405", "B023"]
