name: Build and push TG WebSocket Proxy

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lordarrin/tg-ws-proxy

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set date tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}
          cache-from: type=gha,scope=tg-proxy
          cache-to: type=gha,mode=max,scope=tg-proxy

  sync-to-dockerhub:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set date tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to GHCR
        run: |
          skopeo login ghcr.io \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Docker Hub
        run: |
          skopeo login docker.io \
            --username ${{ secrets.DOCKERHUB_USERNAME }} \
            --password ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync images to Docker Hub
        run: |
          IMAGE="${{ env.IMAGE_NAME }}"
          DATE="${{ steps.date.outputs.date }}"
          
          echo "Syncing multi-architecture images to Docker Hub..."
          
          echo "Syncing $IMAGE:latest ..."
          skopeo copy --all \
            "docker://ghcr.io/$IMAGE:latest" \
            "docker://docker.io/$IMAGE:latest"
          
          echo "Syncing $IMAGE:$DATE ..."
          skopeo copy --all \
            "docker://ghcr.io/$IMAGE:$DATE" \
            "docker://docker.io/$IMAGE:$DATE"
          
          echo "All images synced successfully to Docker Hub"
